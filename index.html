const questions=[{"scenario": "A tutoring centre wants to compare its output this term with last term. Sessions vary in duration, class size and difficulty, and the centre has no agreed way to express these differences as one output measure.", "prompt": "What is the main difficulty in measuring productivity in this situation?", "options": ["The centre has too many employees", "Precise and comparable units of output are unavailable", "Competitors have different advertising budgets", "The centre operates for too many hours", "Productivity can only be measured in factories"], "answer": 1, "explanation": "Productivity is output divided by input. A meaningful comparison requires a consistent output measure, which is difficult when sessions differ in several ways.", "visual": ""}, {"scenario": "A company adopts a corporate strategy of competing through rapid delivery. Its operations department must now decide how to organise capacity and scheduling.", "prompt": "Which statement best describes the relationship between these decisions?", "options": ["Operations strategy should ignore corporate strategy", "Corporate strategy is determined only by the finance department", "Each department should pursue unrelated goals", "The operations strategy should support the corporate strategy", "Corporate strategy specifies every employee’s daily task"], "answer": 3, "explanation": "Functional strategies, including operations strategy, should support the overall corporate strategy. Capacity and scheduling decisions should help achieve rapid delivery.", "visual": ""}, {"scenario": "A customer receives a one hour live lesson from a tutor. The quality of the lesson depends partly on the tutor’s interaction with that customer.", "prompt": "Which characteristic most clearly distinguishes this service from the production of standard manufactured goods?", "options": ["Its quality can be difficult to measure objectively", "It can be placed in inventory for later sale", "It requires no customer participation", "It always has a longer response time", "It is always more capital intensive"], "answer": 0, "explanation": "Service quality often depends on the interaction and the customer’s experience, making it difficult to measure objectively. The live lesson itself cannot be stored as finished inventory.", "visual": ""}, {"scenario": "Five appliance manufacturers adopt the approaches below. Each manufacturer wants to gain an advantage over competitors.", "prompt": "Which approach most clearly competes through product differentiation?", "options": ["Reducing raw material waste to lower costs", "Using fewer labour hours per unit", "Matching competitors’ product features exactly", "Reducing warehouse rent", "Offering uniquely reliable appliances with longer durability"], "answer": 4, "explanation": "Distinctive reliability and durability create customer value and distinguish the product. The cost reduction approaches primarily compete through lower cost.", "visual": ""}, {"scenario": "A Kingston factory produces 7,200 units in one month. Labour productivity is 0.20 units per labour hour. Every employee works 180 hours during that month.", "prompt": "How many employees are required?", "options": ["40", "100", "200", "400", "720"], "answer": 2, "explanation": "Required labour hours = 7,200 ÷ 0.20 = 36,000. Employees = 36,000 ÷ 180 = 200.", "visual": ""}, {"scenario": "A cleaner initially uses 8 kg each of chemicals A, B and C to clean one building. The firm then adds another 8 kg each of A and B per building, while the quantity of C and the number of buildings cleaned remain unchanged. Measure productivity as buildings cleaned per total kg of chemicals.", "prompt": "How does productivity change?", "options": ["It falls by 25%", "It falls by 40%", "It rises by 40%", "It remains unchanged", "It falls by 66.67%"], "answer": 1, "explanation": "Chemical input rises from 24 kg to 40 kg per building. New productivity divided by old productivity = (1/40) ÷ (1/24) = 0.60, so productivity falls by 40%.", "visual": ""}, {"scenario": "A car wash cleans 180 cars per hour using four employees paid JMD 500 each per hour, JMD 600 of water and JMD 400 of electricity per hour. It measures multifactor productivity as cars cleaned per JMD of these three inputs. Each alternative below changes only the stated item.", "prompt": "Which change produces the greatest increase in this productivity measure?", "options": ["Raising the selling price by 10%", "Reducing water cost from JMD 600 to JMD 500 per hour", "Reducing each employee’s wage from JMD 500 to JMD 480 per hour", "Increasing output from 180 to 210 cars per hour with the same inputs", "Reducing electricity cost from JMD 400 to JMD 350 per hour"], "answer": 3, "explanation": "Current input cost is 4 × 500 + 600 + 400 = JMD 3,000 and productivity is 180/3,000 = 0.06. Increasing output gives 210/3,000 = 0.07, a 16.67% improvement, larger than any stated cost saving. Selling price does not enter this output measure.", "visual": ""}, {"scenario": "Monthly demand from May to September is 180, 190, 200, 220 and 240 units respectively. A three month weighted moving average assigns weights of 0.20, 0.30 and 0.50 from the oldest to the most recent of the three observations.", "prompt": "What is the demand forecast for October?", "options": ["226 units", "220 units", "214 units", "230 units", "206 units"], "answer": 0, "explanation": "Use July, August and September: 0.20(200) + 0.30(220) + 0.50(240) = 40 + 66 + 120 = 226 units.", "visual": ""}, {"scenario": "A restaurant chain gives each country’s managers substantial freedom to adapt menus and operations to local tastes. It places little emphasis on obtaining cost savings through worldwide standardisation.", "prompt": "Which international operations strategy best fits this approach?", "options": ["Global strategy", "International strategy", "Transnational strategy", "Export only strategy", "Multidomestic strategy"], "answer": 4, "explanation": "A multidomestic strategy emphasises high local responsiveness and relatively low pressure for global cost reduction. A global strategy emphasises standardisation and cost reduction; a transnational strategy aims for both.", "visual": ""}, {"scenario": "A food outlet records sales of 400, 420, 450 and 500 meals in months 1 to 4 respectively. The forecast for month 1 is 400 meals. Subsequent forecasts use exponential smoothing with a smoothing constant of 0.60.", "prompt": "What is the forecast for month 5? Do not round intermediate forecasts.", "options": ["450.00 meals", "462.00 meals", "473.92 meals", "488.00 meals", "500.00 meals"], "answer": 2, "explanation": "F₂ = 400. F₃ = 0.60(420) + 0.40(400) = 412. F₄ = 0.60(450) + 0.40(412) = 434.8. F₅ = 0.60(500) + 0.40(434.8) = 473.92.", "visual": ""}, {"scenario": "Actual demand in months 1 to 4 is 120, 130, 125 and 140 units. A one month moving average uses the previous month’s actual demand as the forecast. Evaluate only months 2 to 4, for which forecasts are available.", "prompt": "What is the mean squared error (MSE), rounded to two decimal places?", "options": ["116.67", "100.00", "10.00", "350.00", "12.50"], "answer": 0, "explanation": "Forecasts for months 2 to 4 are 120, 130 and 125. Errors are 10, −5 and 15. MSE = (10² + (−5)² + 15²)/3 = 350/3 = 116.67.", "visual": ""}, {"scenario": "A manager reports that model A has MAD = 8, model B has MSE = 20 and model C has MAPE = 5%. All were evaluated on the same demand series, but no other performance measures are supplied.", "prompt": "What is the most defensible conclusion?", "options": ["Model C must be best because 5 is the smallest number", "Model A must be worst because MAD uses absolute errors", "Model B must be best because squared errors are always smaller", "The three reported values cannot be directly ranked because they use different measures", "Model A and model C must be equally accurate"], "answer": 3, "explanation": "MAD is measured in the original units, MSE in squared units and MAPE as a percentage. Comparing these numbers directly cannot establish which model performs best; compare models using the same error measure.", "visual": ""}, {"scenario": "A shop compares forecasts with actual sales for four months. Each entry is measured in units.", "prompt": "What is the mean absolute deviation (MAD)?", "options": ["−7.5 units", "10 units", "20 units", "25 units", "17.5 units"], "answer": 4, "explanation": "Absolute errors are 20, 10, 20 and 20. MAD = (20 + 10 + 20 + 20)/4 = 17.5 units.", "visual": "<div class=\"tablewrap\"><table><thead><tr><th>Month</th><th>Actual sales</th><th>Forecast</th></tr></thead><tbody><tr><td>1</td><td>80</td><td>100</td></tr><tr><td>2</td><td>140</td><td>130</td></tr><tr><td>3</td><td>160</td><td>180</td></tr><tr><td>4</td><td>220</td><td>200</td></tr></tbody></table></div>"}, {"scenario": "An oil refinery produces a highly standardised product in very large volumes. Its equipment operates continuously and the firm has invested heavily in specialised machinery.", "prompt": "Which process type is most appropriate?", "options": ["Job shop", "Continuous process", "Project process", "Low volume batch process", "Custom workshop"], "answer": 1, "explanation": "A continuous process suits very high volume, standardised output and typically uses specialised, capital intensive equipment. Job shops and projects support much more customisation.", "visual": ""}, {"scenario": "A forecasting method produces the actual demand and forecasts shown below for five months. All actual demands are positive.", "prompt": "What is the mean absolute percentage error (MAPE)?", "options": ["4%", "5%", "10%", "12%", "20%"], "answer": 2, "explanation": "Absolute percentage errors are 10%, 10%, 10%, 0% and 20%. MAPE = (10 + 10 + 10 + 0 + 20)/5 = 10%.", "visual": "<div class=\"tablewrap\"><table><thead><tr><th>Month</th><th>Actual demand</th><th>Forecast</th></tr></thead><tbody><tr><td>1</td><td>100</td><td>110</td></tr><tr><td>2</td><td>80</td><td>72</td></tr><tr><td>3</td><td>120</td><td>132</td></tr><tr><td>4</td><td>50</td><td>50</td></tr><tr><td>5</td><td>150</td><td>120</td></tr></tbody></table></div>"}, {"scenario": "Each finished unit requires 26 minutes of total task work. A factory operates 480 minutes per day and wants 100 units per day. The proposed line has five workstations.", "prompt": "Can five workstations meet this target, even if the work is perfectly balanced?", "options": ["Yes, because each workstation has 480 minutes", "Yes, because the required cycle time is 5.2 minutes", "Yes, provided idle time is zero", "The answer depends only on material cost", "No; the five stations provide less work capacity than the target requires"], "answer": 4, "explanation": "Required cycle time = 480/100 = 4.8 minutes. Five stations provide 5 × 4.8 = 24 minutes of work per cycle, below the 26 minutes required. The theoretical minimum is ceiling(26/4.8) = 6 stations.", "visual": ""}, {"scenario": "A plant has 450 minutes of available production time each day. Demand is 90 units per day and total task time is 23 minutes per unit.", "prompt": "What is the theoretical minimum number of workstations? Ignore precedence restrictions for this lower bound.", "options": ["3", "4", "5", "6", "9"], "answer": 2, "explanation": "Cycle time = 450/90 = 5 minutes. The theoretical minimum is ceiling(23/5) = ceiling(4.6) = 5 workstations. Precedence restrictions can make the actual requirement larger.", "visual": ""}, {"scenario": "A firm uses exponential smoothing. Its actual demand and forecasts appear below. The same smoothing constant is used throughout, without rounding.", "prompt": "What smoothing constant generates these forecasts?", "options": ["0.40", "0.20", "0.25", "0.60", "0.80"], "answer": 0, "explanation": "Use F₃ = F₂ + α(A₂ − F₂). Thus 72 = 80 + α(60 − 80), giving α = 0.40. This also gives F₄ = 72 + 0.40(90 − 72) = 79.2.", "visual": "<div class=\"tablewrap\"><table><thead><tr><th>Period</th><th>Actual demand</th><th>Forecast</th></tr></thead><tbody><tr><td>1</td><td>80</td><td>80</td></tr><tr><td>2</td><td>60</td><td>80</td></tr><tr><td>3</td><td>90</td><td>72</td></tr><tr><td>4</td><td>75</td><td>79.2</td></tr></tbody></table></div>"}, {"scenario": "An assembly line uses six workstations and a specified operating cycle time of 12 minutes. Total task time per unit is 60 minutes. All stations can complete their assigned work within the cycle time.", "prompt": "What is the line efficiency at the specified cycle time?", "options": ["72.00%", "80.00%", "90.00%", "83.33%", "100.00%"], "answer": 3, "explanation": "Line efficiency = total task time/(number of stations × cycle time) × 100 = 60/(6 × 12) × 100 = 83.33%.", "visual": ""}, {"scenario": "A manufacturer first chooses a country for a new facility and then chooses an individual site within that country. It separates country level considerations from site level considerations.", "prompt": "Which item is primarily a site level consideration?", "options": ["National exchange rate conditions", "Whether the particular plot is zoned for industrial use", "Availability and productivity of the national labour force", "National government attitudes toward foreign investment", "Proximity of the country to major overseas markets"], "answer": 1, "explanation": "Zoning of a particular plot is principally a site level consideration. Exchange rates, national labour conditions, government attitudes and access to overseas markets guide the country decision.", "visual": ""}, {"scenario": "Process X has fixed costs of JMD 120,000 and variable costs of JMD 40 per unit. Process Y has fixed costs of JMD 180,000 and variable costs of JMD 25 per unit. Both can meet all relevant demand levels, and product quality is identical.", "prompt": "Which statement about total cost is correct?", "options": ["Process X costs less at every volume", "Process Y costs less at every volume", "Costs are equal at 4,000 units; Y costs less above that volume", "Costs are equal at 4,000 units; X costs less above that volume", "Costs are equal at 6,000 units; X costs less below that volume"], "answer": 2, "explanation": "Set 120,000 + 40Q = 180,000 + 25Q. Then 15Q = 60,000 and Q = 4,000. Above this volume, Y’s lower variable cost outweighs its higher fixed cost.", "visual": ""}, {"scenario": "A manager compares five suppliers using two criteria. Criterion A has weight 0.70 and criterion B has weight 0.30. Ratings run from 1 to 5, with 1 representing the best performance. The manager selects the lowest weighted score.", "prompt": "Which supplier should be selected?", "options": ["Alpha", "Beta", "Gamma", "Delta", "Epsilon"], "answer": 0, "explanation": "Weighted scores are Alpha 0.70(1) + 0.30(4) = 1.90; Beta 2.30; Gamma 2.40; Delta 3.10; Epsilon 2.60. Alpha has the lowest score.", "visual": "<div class=\"tablewrap\"><table><thead><tr><th>Supplier</th><th>Criterion A</th><th>Criterion B</th></tr></thead><tbody><tr><td>Alpha</td><td>1</td><td>4</td></tr><tr><td>Beta</td><td>2</td><td>3</td></tr><tr><td>Gamma</td><td>3</td><td>1</td></tr><tr><td>Delta</td><td>4</td><td>1</td></tr><tr><td>Epsilon</td><td>2</td><td>4</td></tr></tbody></table></div>"}, {"scenario": "A distributor plans a warehouse using the centre of gravity method. Demand at each destination provides the weight. Coordinates are on the same rectangular grid, and transportation cost per unit per distance is the same for all destinations.", "prompt": "What are the warehouse coordinates?", "options": ["(5.6, 7.4)", "(6.5, 6.0)", "(7.0, 5.5)", "(7.4, 5.6)", "(8.0, 4.0)"], "answer": 3, "explanation": "Total demand = 100. Weighted x = (2×20 + 8×30 + 6×10 + 10×40)/100 = 740/100 = 7.4. Weighted y = (4×20 + 2×30 + 10×10 + 8×40)/100 = 560/100 = 5.6.", "visual": "<div class=\"tablewrap\"><table><thead><tr><th>Destination</th><th>x</th><th>y</th><th>Monthly demand</th></tr></thead><tbody><tr><td>A</td><td>2</td><td>4</td><td>20</td></tr><tr><td>B</td><td>8</td><td>2</td><td>30</td></tr><tr><td>C</td><td>6</td><td>10</td><td>10</td></tr><tr><td>D</td><td>10</td><td>8</td><td>40</td></tr></tbody></table></div>"}, {"scenario": "Plant A has annual fixed costs of JMD 3,000,000 and variable costs of JMD 12 per unit. Plant B has annual fixed costs of JMD 5,000,000 and variable costs of JMD 8 per unit. Annual demand is 800,000 units, and either plant has sufficient capacity.", "prompt": "Which plant has the lower annual total cost, and by how much?", "options": ["Plant A by JMD 800,000", "Plant A by JMD 1,200,000", "Both have the same total cost", "Plant B by JMD 2,000,000", "Plant B by JMD 1,200,000"], "answer": 4, "explanation": "Plant A costs 3,000,000 + 12(800,000) = JMD 12,600,000. Plant B costs 5,000,000 + 8(800,000) = JMD 11,400,000. Plant B is cheaper by JMD 1,200,000.", "visual": ""}, {"scenario": "A retailer considers expert judgement, time series analysis and causal models to forecast future demand.", "prompt": "Which statement is false?", "options": ["Qualitative methods can use expert opinions", "A time series model necessarily explains demand using advertising expenditure and competitors’ actions", "A causal model can relate demand to advertising expenditure", "A time series consists of observations ordered over time", "Moving averages use past observations to generate forecasts"], "answer": 1, "explanation": "A time series model uses patterns in the variable’s own past observations. Relating demand to explanatory variables such as advertising expenditure is a causal modelling approach; it is not a necessary feature of time series analysis.", "visual": ""}, {"scenario": "The current process produces 240 units per hour using 10 workers. A proposed process produces 330 units per hour using 12 workers. Workers earn JMD 600 per hour. Overhead equals 50% of labour cost. Material cost is JMD 3,000 per hour for the current process and JMD 4,200 per hour for the proposed process. Compare output per JMD of labour, overhead and materials only.", "prompt": "Which decision is supported by multifactor productivity?", "options": ["Keep the current process because fewer workers are used", "Keep the current process because material costs are lower", "Choose the proposed process: 0.022 units/JMD versus 0.020 units/JMD", "Either process gives the same productivity", "Choose the proposed process because 0.020 exceeds 0.022"], "answer": 2, "explanation": "Current cost = 6,000 + 3,000 + 3,000 = JMD 12,000, so productivity = 240/12,000 = 0.020. Proposed cost = 7,200 + 3,600 + 4,200 = JMD 15,000, so productivity = 330/15,000 = 0.022, a 10% increase.", "visual": ""}, {"scenario": "A firm uses the basic economic order quantity model. Delivery lead time increases from three to six working days. Annual demand, ordering cost and annual holding cost per unit remain unchanged; demand is steady and no safety stock is held.", "prompt": "What happens to the economic order quantity?", "options": ["It doubles", "It increases by the square root of two", "It halves", "It remains unchanged", "It falls to zero"], "answer": 3, "explanation": "Basic EOQ = √(2DS/H), which does not include lead time. The reorder point increases, but EOQ stays the same when D, S and H are unchanged.", "visual": ""}, {"scenario": "A factory uses 500 kg of a material per working week and operates five days per week. Delivery lead time is three working days. Demand and lead time are constant, and the factory holds no safety stock.", "prompt": "At what inventory level should the material be reordered?", "options": ["300 kg", "100 kg", "500 kg", "1,500 kg", "200 kg"], "answer": 0, "explanation": "Daily usage = 500/5 = 100 kg. Reorder point = daily demand × lead time = 100 × 3 = 300 kg.", "visual": ""}, {"scenario": "A retailer sells 60 units per week for 50 weeks per year. Ordering cost is JMD 150 per order. Unit value is JMD 500 and annual holding cost is 20% of that value. It currently orders 150 units at a time. Apply the basic EOQ model.", "prompt": "How does the current order quantity compare with EOQ?", "options": ["It is exactly optimal", "It is larger than the EOQ", "EOQ cannot be calculated without lead time", "It gives zero holding cost", "It is smaller than the EOQ"], "answer": 4, "explanation": "Annual demand D = 60 × 50 = 3,000; H = 0.20 × 500 = JMD 100 per unit per year. EOQ = √(2 × 3,000 × 150 / 100) = √9,000 ≈ 94.87 units. The current quantity of 150 is too large.", "visual": ""}, {"scenario": "A store has annual demand of 1,200 units, ordering cost of JMD 20 per order and annual holding cost of JMD 4 per unit. Demand is steady and replenishment is instantaneous. Compare annual ordering plus holding cost; purchase cost is identical under both policies.", "prompt": "How much more does ordering a full year’s supply at once cost than ordering the exact EOQ? Round the final difference to the nearest JMD.", "options": ["JMD 2,420", "JMD 1,982", "JMD 438", "JMD 2,182", "JMD 1,200"], "answer": 1, "explanation": "EOQ = √(2 × 1,200 × 20 / 4) = √12,000 ≈ 109.54. Minimum annual ordering plus holding cost = √(2DSH) = √192,000 ≈ JMD 438.18. At Q = 1,200 the cost is (1,200/1,200)20 + (1,200/2)4 = JMD 2,420. Difference = JMD 1,981.82, rounded to JMD 1,982.", "visual": ""}];

// Standalone practice exam. All marking happens locally; no scores are sent to a server.
// Increment this key when publishing a different question set.
const KEY='nlts-mgmt2026-mock-v1';
const DURATION=60*60*1000;
const app=document.getElementById('app');
const dialog=document.getElementById('confirm');
let state=null, interval=null, storageOK=true;
let celebrationTimeout=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(s){return s&&s.version===1&&typeof s.name==='string'&&Number.isFinite(s.deadline)&&Number.isFinite(s.started)&&Number.isInteger(s.index)&&s.index>=0&&s.index<questions.length&&Array.isArray(s.answers)&&s.answers.length===questions.length&&s.answers.every((a,i)=>a===null||(Number.isInteger(a)&&a>=0&&a<questions[i].options.length))&&(s.done||s.answers.slice(0,s.index).every(a=>a!==null))&&typeof s.done==='boolean';}
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(valid(saved))state=saved;}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;const n=document.getElementById('storageWarning');if(n)n.classList.remove('hidden');}}
function remaining(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
function start(){const name=document.getElementById('studentName').value.trim();if(!name){document.getElementById('nameError').textContent='Please enter your name before starting.';document.getElementById('studentName').focus();return;}const t=Date.now();state={version:1,name,started:t,deadline:t+DURATION,index:0,answers:Array(30).fill(null),done:false};save();renderQuestion();runTimer();}
function intro(){app.innerHTML=`<div class="intro"><section><div class="eyebrow">MGMT2026 · Practice examination</div><h1>Midsemester<br>Mock Exam</h1><p class="muted">Build your confidence with 30 original questions modelled on your MGMT2026 past paper.</p><div class="stats"><div class="stat"><strong>30</strong><span>Multiple choice questions</span></div><div class="stat"><strong>60</strong><span>Minutes to complete</span></div><div class="stat"><strong>1</strong><span>Mark per question</span></div></div><p><strong>No limits to what you can achieve.</strong></p></section><section class="panel"><div class="eyebrow">Before you begin</div><h2>Your exam instructions</h2><ol class="rules"><li>Each page shows one question with its complete scenario.</li><li>Choose one answer, then select <strong>Save & continue</strong>. You cannot return to an earlier question.</li><li>There is no skip button. You must select an answer before continuing.</li><li>The timer begins when you start. It continues if you refresh or leave the page.</li><li>Your exam submits automatically when time expires. Answers and explanations appear only after submission.</li><li>A non programmable calculator is permitted.</li><li>After submission, you may start another attempt with a fresh one hour timer.</li></ol><form id="startForm"><label class="name" for="studentName">Student name</label><input id="studentName" type="text" maxlength="100" autocomplete="name" placeholder="Enter your full name" required><p id="nameError" class="error" role="alert"></p><button class="btn wide" type="submit">Start mock exam <span aria-hidden="true">→</span></button></form><p class="note">Your name and responses stay in this browser. Results are not sent to NLTS. Use your own browser profile on a shared device.</p><p class="error ${storageOK?'hidden':''}">Browser storage is unavailable. Keep this page open to preserve your attempt.</p></section></div>`;document.getElementById('startForm').onsubmit=e=>{e.preventDefault();start();};}
function renderQuestion(){if(state.done){results();return;}if(remaining()===0){finish(true);return;}const q=questions[state.index];app.innerHTML=`<div class="topbar"><div><div class="eyebrow">Midsemester Mock Exam</div><strong>${esc(state.name)}</strong></div><div class="timer" id="timer" role="timer" aria-label="Time remaining"><small>TIME REMAINING</small><strong id="clock">60:00</strong></div></div><div class="progress" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="30" aria-valuenow="${state.index}"><span style="width:${state.index/30*100}%"></span></div><div class="examgrid"><aside class="side"><div class="panel"><div class="eyebrow">Your progress</div><h2>${state.index+1} <span class="muted">/ 30</span></h2><h3>Forward only</h3><p>Once you continue, this question is locked.</p><h3>One best answer</h3><p>Each correct answer earns one mark. No marks are deducted for an incorrect response.</p><p>Answers become available after you submit.</p></div></aside><section class="panel" aria-labelledby="questionTitle"><span class="tag">Question ${state.index+1}</span><div class="scenario"><div class="eyebrow">Scenario</div><p>${esc(q.scenario)}</p></div>${q.visual}<h2 id="questionTitle" tabindex="-1">${esc(q.prompt)}</h2><fieldset class="options"><legend>Select one answer for question ${state.index+1}</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${state.answers[state.index]===i?'checked':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset><div class="actions"><button class="btn" id="next" ${state.answers[state.index]===null?'disabled':''}>${state.index===29?'Submit exam':'Save & continue'} <span aria-hidden="true">→</span></button></div><p id="storageWarning" class="error ${storageOK?'hidden':''}" role="alert">Browser storage is unavailable. Keep this page open to preserve your attempt.</p><p class="note">Question ${state.index+1} of 30 · No return to previous questions</p></section></div><p id="timeNotice" class="error" role="status"></p>`;app.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{if(remaining()===0){finish(true);return;}state.answers[state.index]=Number(el.value);save();document.getElementById('next').disabled=false;});document.getElementById('next').onclick=()=>advance();tick();}
function advance(){if(state.done)return;if(remaining()===0){finish(true);return;}if(state.answers[state.index]===null)return;if(state.index===29){document.getElementById('confirmText').textContent=`You have answered ${state.answers.filter(a=>a!==null).length} of 30 questions. Your score and correct answers will appear after submission.`;dialog.showModal();return;}state.index++;save();renderQuestion();window.scrollTo(0,0);document.getElementById('questionTitle')?.focus({preventScroll:true});}
function tick(){if(!state||state.done)return;const secs=remaining();if(secs===0){finish(true);return;}const clock=document.getElementById('clock');if(clock)clock.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');document.getElementById('timer')?.classList.toggle('urgent',secs<=300);const notice=document.getElementById('timeNotice');if(notice&&secs<=300&&!notice.textContent)notice.textContent='Five minutes or less remain. Your exam will submit automatically when the timer reaches zero.';}
function runTimer(){clearInterval(interval);tick();if(!state.done)interval=setInterval(tick,250);}
function finish(timeout){if(!state||state.done)return;state.done=true;state.timedOut=!!timeout||remaining()===0;state.finished=Date.now();save();clearInterval(interval);if(dialog.open)dialog.close();results();window.scrollTo(0,0);}
function gradeFeedback(score){const percent=score/questions.length*100;if(score===questions.length)return {icon:'🏆 🎉 🎈',title:'Perfect score! Congratulations!',message:'You answered every question correctly. Celebrate your achievement!'};if(percent>=80)return {icon:'🌟 👏',title:'Excellent performance!',message:'You are doing very well. Review your missed questions and aim for 100%.'};if(percent>=70)return {icon:'🎯 👍',title:'Good work!',message:'You have a strong foundation. Review the explanations and practise again.'};if(percent>=50)return {icon:'📚 💪',title:'Keep building your confidence!',message:'Review your incorrect answers, work through the explanations and try again.'};return {icon:'🌱 📖',title:'Every attempt is a chance to improve.',message:'Take your time with the explanations. Practise each calculation and return for another attempt.'};}
function clearCelebration(){clearTimeout(celebrationTimeout);document.getElementById('celebration')?.remove();}
function celebrate(){clearCelebration();const layer=document.createElement('div');layer.id='celebration';layer.className='celebration';layer.setAttribute('aria-hidden','true');layer.innerHTML=Array.from({length:18},(_,i)=>`<span class="balloon" style="left:${(i+0.5)/18*100}%;--delay:${i%6*0.3}s">🎈</span>`).join('');document.body.appendChild(layer);celebrationTimeout=setTimeout(clearCelebration,8200);}
function retry(){if(!state||!state.done)return;clearCelebration();clearInterval(interval);const name=state.name;const attempt=(Number.isInteger(state.attempt)?state.attempt:1)+1;state=null;intro();document.getElementById('studentName').value=name;const form=document.getElementById('startForm');form.onsubmit=e=>{e.preventDefault();start();if(state){state.attempt=attempt;save();}};window.scrollTo(0,0);document.getElementById('studentName').focus();}
function results(){const score=questions.reduce((sum,q,i)=>sum+(state.answers[i]===q.answer?1:0),0);const feedback=gradeFeedback(score);const answered=state.answers.filter(a=>a!==null).length;const mins=Math.min(60,Math.max(0,Math.ceil(((state.finished||state.deadline)-state.started)/60000)));app.innerHTML=`<section class="resulthead"><div><div class="eyebrow">Exam complete · Attempt ${state.attempt||1}</div><h1 style="font-size:34px;margin:12px 0">${esc(state.name)}, here are your results.</h1><p class="muted">${state.timedOut?'Time expired. Your saved responses were submitted automatically.':'Your exam has been submitted.'}</p><div class="grade-message"><span class="grade-icon" aria-hidden="true">${feedback.icon}</span>${feedback.title}</div><p class="muted">${feedback.message}</p><p class="muted">${answered} answered · ${30-answered} unanswered · ${mins} minutes used</p></div><div><div class="score">${score}<span style="font-size:24px;color:#bfcce4"> / 30</span></div><strong>${(score/30*100).toFixed(1)}%</strong></div></section><div class="notice">Your result is saved on this browser only. Print or save it as a PDF to share it with your tutor. For information about tutoring, contact us at <a href="tel:18765692703">18765692703</a>.</div><div class="result-buttons"><button class="btn" id="retry">Try again</button><button class="btn secondary printbutton" id="print">Print results / Save as PDF</button></div><p class="note">You can attempt this quiz as many times as you like. Each new attempt starts with 60 minutes and cleared answers. The same 30 questions are used. Save your result before starting again.</p><h2 style="margin-top:32px">Answer key and explanations</h2><p class="muted">Review each scenario, your response and the correct answer.</p>${questions.map((q,i)=>{const a=state.answers[i],right=a===q.answer;return `<article class="review"><span class="tag">Question ${i+1}</span><span class="${right?'correct':'wrong'}" style="float:right;font-weight:700">${right?'Correct':'0 marks'}</span><div class="scenario"><p>${esc(q.scenario)}</p></div>${q.visual}<h3>${esc(q.prompt)}</h3><p class="${right?'correct':'wrong'}"><strong>Your answer:</strong> ${a===null?'Not answered':String.fromCharCode(65+a)+'. '+esc(q.options[a])}</p><p class="correct"><strong>Correct answer:</strong> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</p><p><strong>Explanation:</strong> ${esc(q.explanation)}</p></article>`;}).join('')}<p class="note">This is an original NLTS practice exam based on the topics in the supplied past paper, not an official university examination.</p>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('retry').onclick=retry;if(score===questions.length)celebrate();else clearCelebration();}
document.getElementById('cancelSubmit').onclick=()=>dialog.close();document.getElementById('confirmSubmit').onclick=()=>finish(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('pageshow',tick);window.addEventListener('beforeunload',e=>{if(state&&!state.done){e.preventDefault();e.returnValue='';}});
// The exam never uses browser history to move between questions.
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);if(valid(s)){state=s;if(state.done){clearInterval(interval);if(dialog.open)dialog.close();results();}else{renderQuestion();runTimer();}}}catch(err){}}});
if(state){if(state.done)results();else{renderQuestion();runTimer();}}else intro();
</script></body></html>
